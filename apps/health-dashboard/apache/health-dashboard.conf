<VirtualHost *:443>
	ServerName HEALTH_DASHBOARD_HOST
	HEALTH_DASHBOARD_SSL_CONFIG
	DocumentRoot HEALTH_DASHBOARD_DIR/htdocs

	<Directory HEALTH_DASHBOARD_DIR/htdocs>
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Require all granted
		AllowOverride All
	</Directory>
</VirtualHost>

<VirtualHost *:443>
	ServerName www.HEALTH_DASHBOARD_HOST
	ServerAlias *.HEALTH_DASHBOARD_HOST
	HEALTH_DASHBOARD_SSL_CONFIG
	redirect permanent / https://HEALTH_DASHBOARD_HOST/
</VirtualHost>

<VirtualHost *:80>
	ServerName HEALTH_DASHBOARD_HOST
	Redirect permanent / https://HEALTH_DASHBOARD_HOST/
</VirtualHost>

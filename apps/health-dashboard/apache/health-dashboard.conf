<VirtualHost *:443>
	ServerName health.deadsea.ostermiller.org
    Include include/oster-ssl.conf
	DocumentRoot HEALTH_DASHBOARD_DIR/htdocs

	<Directory HEALTH_DASHBOARD_DIR/htdocs>
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Require all granted
		AllowOverride All
	</Directory>

	<Location />
			Include include/ostermiller-password-protect.conf
	</Location>
</VirtualHost>

<VirtualHost *:443>
        ServerName www.health.deadsea.ostermiller.org
        ServerAlias *.health.deadsea.ostermiller.org
        Include include/oster-ssl.conf
        redirect permanent / https://health.deadsea.ostermiller.org/
</VirtualHost>

<VirtualHost *:80>
	ServerName health.deadsea.ostermiller.org
	Redirect permanent / https://health.deadsea.ostermiller.org/
</VirtualHost>
